 <!DOCTYPE html>
<html>
<head>
    <title>Hyperlinks Example</title>
</head>

<body>

    <h1>HTML Hyperlinks</h1>
    <a href="https://www.google.com" target="_self">
        Open Google in Same Window
    </a>

    <br><br>
    <a href="https://www.youtube.com" target="_blank">
        Open YouTube in New Tab
    </a>

    <br><br>
    <a href="https://www.amazon.in" target="_top">
        Open Amazon
    </a>

</body>
</html>
